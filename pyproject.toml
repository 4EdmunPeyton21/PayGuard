[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E402"]
"eval/dataset/generate_dataset.py" = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra -q"
markers = [
    "eval_fast: fast evaluation suite without API calls",
]